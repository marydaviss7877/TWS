<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!--
    HousesBase — Compact / Stacked Lockup
    Open Doorway mark (#4) centered above wordmark and descriptor.
    Use when horizontal space is limited.
  -->

  <!-- ─── Mark (centered) ─── -->
  <g transform="translate(90,0)">
    <path
      d="
        M10,10 H110 V110 H80 V44 H56 V110
        H42 L48,44 H28 V110 H10 Z
      "
      fill="#17324D"
    />
    <path d="M56,80 L80,48 V110 H56 Z" fill="#C84A32"/>
  </g>

  <!-- ─── Wordmark (centered) ─── -->
  <text
    x="150" y="144"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans','Inter','Helvetica Neue',Arial,sans-serif"
    font-size="34" font-weight="800" letter-spacing="-0.5"
    fill="#17324D"
  >HousesBase</text>

  <!-- ─── Descriptor (centered) ─── -->
  <text
    x="150" y="168"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans','Inter','Helvetica Neue',Arial,sans-serif"
    font-size="9" font-weight="600" letter-spacing="3"
    fill="#17324D" opacity="0.45"
  >SOFTWARE HOUSE OS</text>
</svg>
