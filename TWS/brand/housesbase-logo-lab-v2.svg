<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .panel{fill:#f4f0e8}.dark{fill:#132b43}.ink{fill:#132b43}.paper{fill:#f4f0e8}.blue{fill:#26a7df}.lime{fill:#b8eb4b}.coral{fill:#e05b42}.muted{fill:#71808d}
      .rule{stroke:#c8c2b7;stroke-width:1}.drule{stroke:#35506a;stroke-width:1}
      .n{font:800 22px Arial,sans-serif;letter-spacing:1px}.label{font:700 11px Arial,sans-serif;letter-spacing:2px}.word{font:800 26px Arial,sans-serif;letter-spacing:-1.1px}.desc{font:700 8px Arial,sans-serif;letter-spacing:2.5px}
      .stroke{fill:none;stroke:#132b43;stroke-width:15;stroke-linecap:square;stroke-linejoin:miter}.dstroke{fill:none;stroke:#f4f0e8;stroke-width:15;stroke-linecap:square;stroke-linejoin:miter}
      .fine{fill:none;stroke:#132b43;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.dfine{fill:none;stroke:#f4f0e8;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#0b1118"/>
  <text x="24" y="25" fill="#f4f0e8" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">HOUSESBASE / SOFTWARE HOUSE ERP / IDENTITY LAB 02</text>
  <text x="1576" y="25" fill="#71808d" text-anchor="end" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">CODE · PEOPLE · DELIVERY · MONEY / ONE BASE</text>

  <!-- 01 CODEBASE: brackets become the house operating spine -->
  <g transform="translate(20 44)">
    <rect class="panel" width="300" height="440" rx="3"/>
    <text class="n ink" x="20" y="34">01</text><text class="label muted" x="62" y="33">CODEBASE</text>
    <line class="rule" x1="20" y1="50" x2="280" y2="50"/>
    <g transform="translate(55 101)">
