      <circle class="blue" cx="4" cy="24" r="11"/><circle class="blue" cx="56" cy="132" r="11"/><circle class="coral" cx="96" cy="24" r="11"/><circle class="lime" cx="148" cy="132" r="11"/><circle class="ink" cx="188" cy="132" r="11"/>
    </g>
    <text class="word ink" x="20" y="307">HousesBase</text>
    <text class="desc muted" x="21" y="328">CONNECTED OPERATIONS</text>
    <text class="label ink" x="20" y="397">ONE THREAD / ZERO GAPS</text>
