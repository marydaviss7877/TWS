      <text x="150" y="55" fill="#26a7df" font-family="Arial,sans-serif" font-size="47" font-weight="800" letter-spacing="-3">Base</text>
      <rect class="lime" x="143" y="7" width="8" height="55"/>
      <path d="M0 74H256" stroke="#f4f0e8" stroke-width="7"/>
      <path d="M0 74H150" stroke="#e05b42" stroke-width="7"/>
