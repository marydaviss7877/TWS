      <path class="dfine" d="M31 31L63 63M121 31L89 63M121 121L89 89M31 121L63 89"/>
      <rect class="lime" x="62" y="62" width="28" height="28" transform="rotate(45 76 76)"/>
    </g>
    <text class="word paper" x="20" y="307">HousesBase</text>
    <text class="desc" fill="#91a4b5" x="21" y="328">ONE OPERATING TRUTH</text>
