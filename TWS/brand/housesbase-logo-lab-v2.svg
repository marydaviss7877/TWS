      <path class="stroke" d="M74 10 V105 M116 10 V105 M74 58 H116"/>
      <rect class="coral" x="42" y="119" width="106" height="14"/>
    </g>
    <text class="word ink" x="20" y="307">HousesBase</text>
    <text class="desc muted" x="21" y="328">SOFTWARE HOUSE ERP</text>
    <text class="label ink" x="20" y="397">FROM CODE TO CONTROL</text>
    <rect class="ink" x="250" y="382" width="30" height="30" rx="4"/><path d="M258 390l-6 7 6 7M272 390l6 7-6 7M263 408l5-22" fill="none" stroke="#f4f0e8" stroke-width="2.5"/>
  </g>

