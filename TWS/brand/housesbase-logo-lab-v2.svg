    <text class="desc" fill="#91a4b5" x="21" y="328">SOFTWARE HOUSE ERP</text>
    <text class="label paper" x="20" y="397">THE NAME IS THE SYSTEM</text>
    <g transform="translate(246 382)"><rect width="30" height="30" rx="4" fill="#f4f0e8"/><path d="M7 6v18M7 15h8M15 6v18M15 6h5c5 0 7 2 7 5 0 2-1 4-4 5 3 1 5 2 5 5" fill="none" stroke="#132b43" stroke-width="2.5"/></g>
  </g>
