      <rect class="blue" x="78" y="102" width="126" height="20"/>
      <rect class="paper" x="78" y="16" width="20" height="70"/>
      <path d="M98 16h42c28 0 42 12 42 31 0 12-6 21-18 26 17 4 25 14 25 29" fill="none" stroke="#f4f0e8" stroke-width="20" stroke-linejoin="round"/>
    </g>
