    <rect class="dark" width="300" height="440" rx="3"/>
    <text class="n paper" x="20" y="34">02</text><text class="label" fill="#91a4b5" x="62" y="33">SOURCE OF TRUTH</text>
    <line class="drule" x1="20" y1="50" x2="280" y2="50"/>
    <g transform="translate(74 102)">
