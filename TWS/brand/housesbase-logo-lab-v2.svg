      <path d="M16 16h26v54h92V16h26v144h-26v-54H42v54H16z" fill="#f4f0e8"/>
      <rect class="coral" x="76" y="70" width="24" height="36"/>
    </g>
    <text class="word ink" x="20" y="307">HousesBase</text>
    <text class="desc muted" x="21" y="328">BUILT FOR SOFTWARE HOUSES</text>
    <text class="label ink" x="20" y="397">STRUCTURE WITHOUT SILOS</text>
    <g transform="translate(250 382)"><rect class="ink" width="30" height="30" rx="4"/><path d="M7 6h6v7h4V6h6v18h-6v-7h-4v7H7z" fill="#f4f0e8"/></g>
