  <!-- 10 WORDMARK HINGE: the verbal identity is the logo -->
  <g transform="translate(1284 520)">
    <rect class="dark" width="296" height="440" rx="3"/>
    <text class="n paper" x="20" y="34">10</text><text class="label" fill="#91a4b5" x="62" y="33">HOUSE / BASE</text>
